<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Site{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/global.css') }}">
    {% block head_extra %}{% endblock %}
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='Images/dumbbell.png') }}">
    <style>


body {
  background-image: url("{{ url_for('static', filename='gym.jpg') }}");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-attachment: fixed;
  /* color: #CCFF00;  /* remove if plain white is preferred (or another colour) */
}
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <div class="header-row">
          <a class="brand" href="{{ url_for('index') }}">UU FakeGym</a>
          <button class="nav-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false" aria-controls="siteNav">
            <span></span>
            <span></span>
            <span></span>
          </button>
        </div>
        <nav class="site-nav" id="siteNav" aria-label="Primary navigation">
          <ul class="nav-links">
            <li><a href="{{ url_for('index') }}">Home</a></li>
            <li><a href="{{ url_for('membership') }}">Membership</a></li>
            <li><a href="{{ url_for('about') }}">About Us</a></li>
            <li><a href="{{ url_for('contact') }}">Contact</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main>
      {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
      <p>© 2026 UU FakeGym. All rights reserved.</p>
    </footer>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="{{ url_for('static', filename='javascript/global.js') }}"></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
